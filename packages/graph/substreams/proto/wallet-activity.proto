syntax = "proto3";
package froggy.wallet.v1;

// Always emitted, including blocks without matching activity.
message BlockActivity {
  uint32 v = 1;
  uint64 number = 2;
  string hash = 3;
  int64 timestamp = 4;
  bool extended = 5;
  bool truncated = 6;
  repeated WalletTransaction transactions = 7;
  repeated string changed_sources = 8;
}
message WalletTransaction {
  string wallet = 1;
  string hash = 2;
  string transaction_from = 3;
  repeated Transfer transfers = 4;
  repeated SwapV2 swaps_v2 = 5;
  repeated SwapV3 swaps_v3 = 6;
  repeated SwapV4 swaps_v4 = 7;
  repeated SwapAerodrome swaps_aerodrome = 8;
  bool truncated = 9;
  repeated CurvePons curves_pons = 10;
}
message Transfer {
  string asset = 1; // "native" or the ERC20 contract address
  string from = 2;
  string to = 3;
  string amount = 4; // unsigned integer, never floating point
  uint64 ordinal = 5;
  uint32 call_index = 6;
  bool call_known = 7;
  uint32 log_index = 8;
}
message SwapLocation {
  string contract = 1;
  uint32 log_index = 2;
  uint32 call_index = 3;
  uint64 begin_ordinal = 4;
  uint64 end_ordinal = 5;
}
// These are decoded candidates, not verified venues or wallet attribution.
message SwapV2 {
  SwapLocation location = 1;
  string sender = 2;
  string recipient = 3;
  string amount0_in = 4;
  string amount1_in = 5;
  string amount0_out = 6;
  string amount1_out = 7;
}
message SwapAerodrome {
  SwapLocation location = 1;
  string sender = 2;
  string recipient = 3;
  string amount0_in = 4;
  string amount1_in = 5;
  string amount0_out = 6;
  string amount1_out = 7;
}
message SwapV3 {
  SwapLocation location = 1;
  string sender = 2;
  string recipient = 3;
  string amount0 = 4;
  string amount1 = 5;
  string sqrt_price_x96 = 6;
  string liquidity = 7;
  string tick = 8;
}
message SwapV4 {
  SwapLocation location = 1;
  string pool_id = 2;
  string sender = 3;
  string amount0 = 4;
  string amount1 = 5;
  string sqrt_price_x96 = 6;
  string liquidity = 7;
  string tick = 8;
  string fee = 9;
}

message CurvePons {
  SwapLocation location = 1;
  string side = 2;
  string actor = 3;
  string recipient = 4;
  string amount_in = 5;
  string amount_out = 6;
  string fee = 7;
  string tax = 8;
}
