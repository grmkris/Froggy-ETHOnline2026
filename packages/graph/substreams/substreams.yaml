specVersion: v0.1.0
package:
  name: froggy_wallet_activity
  version: v0.1.0
  url: https://github.com/grmkris/Froggy-ETHOnline2026
  description: Bounded wallet transfer and decoded swap evidence for Froggy Watchlist alerts
network: base
imports:
  erc20: ./vendor/erc20-transfers-v0.4.0.spkg
  native: ./vendor/evm-native-transfers-v0.2.0.spkg
protobuf:
  files:
    - wallet-activity.proto
  importPaths:
    - ./proto
binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ./target/wasm32-unknown-unknown/release/froggy_wallet_activity.wasm
modules:
  - name: map_wallet_activity
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: erc20:map_events
      - map: native:map_events
    output:
      type: proto:froggy.wallet.v1.BlockActivity
params:
  map_wallet_activity: ""
