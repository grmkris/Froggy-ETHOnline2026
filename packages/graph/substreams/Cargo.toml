[package]
name = "froggy-wallet-activity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
hex = "0.4"
ethabi = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
