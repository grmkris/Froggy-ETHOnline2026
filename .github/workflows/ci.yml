name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        # Equivalent to `bun ci`, spelled out because `bun ci` is not listed in
        # `bun --help` and its frozen-lockfile behaviour is not self-evident.
        run: bun install --frozen-lockfile

      - name: Run deterministic gates
        run: bun run check

      - name: Build applications
        run: bun run build:apps

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: bun run e2e

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Check formatting
        run: forge fmt --check --root packages/contracts

      - name: Build contracts
        run: forge build --sizes --root packages/contracts

      - name: Run contract tests
        run: forge test --root packages/contracts
