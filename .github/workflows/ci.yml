name: CI

on:
  pull_request:
  # Deliberately no `paths-ignore`. Railway's deploy waits for the Actions run on
  # the pushed sha (`checkSuites: true` in .railway/railway.ts), and a sha with
  # no workflow run has nothing to wait on — the deploy hangs in WAITING forever.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: froggy_test
          POSTGRES_DB: froggy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d froggy_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        # Equivalent to `bun ci`, spelled out because `bun ci` is not listed in
        # `bun --help` and its frozen-lockfile behaviour is not self-evident.
        run: bun install --frozen-lockfile

      - name: Run deterministic gates
        run: bun run check

      - name: Migrate test database
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://postgres:froggy_test@127.0.0.1:5432/froggy_test

      - name: Verify Postgres persistence contracts
        run: bun test packages/wallet/src/persistence.test.ts packages/wallet/src/ledger-postgres.test.ts
        env:
          FROGGY_TEST_DATABASE_URL: postgres://postgres:froggy_test@127.0.0.1:5432/froggy_test

      - name: Build applications
        run: bun run build

  # The browser suite is the whole cost of this workflow: the gates take about
  # two minutes, the 236 specs took sixteen on a hosted runner's two workers.
  # Railway waits for the check suite, so wall clock is what a deploy pays.
  # Four hosted shards bring that to six minutes.
  #
  # The netcup box was tried on 13 Sep and is measurably worse *while agents
  # are working on it*: two shards of four workers took 7.4 and 8.0 minutes
  # against six hosted, and four specs failed on 30-second timeouts and
  # ECONNRESET with the box at load 10. Sixteen cores do not help when the
  # sessions running CI are also compiling on them. The runners froggy-1 and
  # froggy-2 stay registered; flip `runs-on` back to
  # [self-hosted, linux, x64, netcup] (two shards, the ports below) once the
  # box is quiet, and it should beat hosted comfortably.
  e2e:
    name: Browser smoke tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A port per shard, spelled out because GitHub's expression syntax has
        # no arithmetic. Harmless on hosted runners, required when several
        # shards share one machine.
        include:
          - shard: 1
            port: 3610
          - shard: 2
            port: 3620
          - shard: 3
            port: 3630
          - shard: 4
            port: 3640
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build applications
        run: bun run build

      # `--with-deps` needs apt and so only works on a hosted runner; drop it
      # when moving this job back to the netcup box, which already carries
      # Chromium's libraries.
      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      # The suite runs against an in-memory store (`DATABASE_URL: ""` in
      # playwright.config.ts), so this job needs no Postgres service.
      # Both shards run on the same box, so each needs its own pair of ports;
      # the config derives the API port from this one.
      - name: Run browser smoke tests
        run: bun run e2e -- --shard=${{ matrix.shard }}/4
        env:
          FROGGY_E2E_PORT: ${{ matrix.port }}
