<!doctype html><meta charset="utf-8" /><title>Froggy capability probe</title>
<style>
  :root {
    --bg: #eff1ec;
    --fg: #15201a;
    --primary: #2f7a4c;
    --brand-soft: #e2efe6;
    --lime: #b6e04a;
  }
  body {
    margin: 0;
    font: 14px/1.5 system-ui;
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    height: 100vh;
  }
  .card {
    background: #fcfdfb;
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 1px 2px #15201a14;
  }
  button {
    background: var(--primary);
    color: #f6fbf7;
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    font: inherit;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 99px;
    background: var(--lime);
    display: inline-block;
    animation: p 1.2s infinite;
  }
  @keyframes p {
    50% {
      opacity: 0.3;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot {
      animation: none;
    }
  }
</style>
<div class="card">
  <p><span class="dot"></span> oklch support: <b id="ok">?</b></p>
  <button id="b">Froggy probe</button>
  <p id="out">idle</p>
</div>
<script>
  document.getElementById("ok").textContent = CSS.supports(
    "color",
    "oklch(0.5 0.1 150)"
  )
    ? "yes"
    : "NO";
  document.getElementById("b").onclick = () =>
    (document.getElementById("out").textContent = "clicked");
</script>
